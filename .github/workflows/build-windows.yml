name: Build Windows EXE

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to build (leave empty to use selected branch)"
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version

          echo "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Application version: $version"

      - name: Build Windows EXE
        run: npm run electron:build -- --publish never

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-demo-windows-v${{ steps.version.outputs.version }}-run-${{ github.run_number }}
          path: dist-electron/*.exe

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml